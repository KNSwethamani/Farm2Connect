<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Details - Farm2Connect</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Farm2Connect</h1>
        <p>Farmer Details</p>
    </header>

    <main>

        <section class="farmer-details">

            <h2 id="farmerName">Loading...</h2>

            <p><strong>Role:</strong> <span id="farmerRole">Farmer</span></p>

            <p><strong>Phone:</strong> <span id="farmerPhone">Loading...</span></p>

            <p><strong>Email:</strong> <span id="farmerEmail">Loading...</span></p>

            <h3>Available Products</h3>

            <div id="farmerProducts">
                Loading products...
            </div>

            <button id="contactFarmerBtn">
                CONTACT FARMER
            </button>

        </section>

    </main>

    <script src="js/farmer-details.js"></script>

</body>
</html>
